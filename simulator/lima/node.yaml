# CKA simulator node: plain Ubuntu 24.04, no Lima-managed containerd, no host mounts.
minimumLimaVersion: 2.0.0
base: template:_images/ubuntu-24.04
vmType: vz
cpus: 2
memory: 2GiB
disk: 20GiB
mounts: []
containerd:
  system: false
  user: false
networks:
- lima: user-v2
# Do not forward guest ports to the Mac automatically (several VMs listen on 6443).
portForwards:
- guestPortRange: [1, 65535]
  ignore: true
